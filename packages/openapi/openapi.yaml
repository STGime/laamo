openapi: 3.1.0
info:
  title: Laamo API
  version: 0.1.0
  description: Contract between the Go api and the web app. Code generation comes in issue #11.
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Service health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    Health:
      type: object
      required: [status, env, eurobase]
      properties:
        status:
          type: string
          example: ok
        env:
          type: string
          example: dev
        eurobase:
          type: string
          enum: [reachable, unreachable, not configured, error]
