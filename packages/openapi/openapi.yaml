openapi: 3.0.3
info:
  title: Laamo API
  version: 0.1.0
  description: |
    Contract between the Go api (backend/internal/api) and the web app
    (apps/web/src/lib/api). Both sides are generated from this file:
    run `task gen` after changing it. CI fails if generated code is stale.

    Auth: sign in with Eurobase auth and send the access token as
    `Authorization: Bearer <token>`. Every endpoint needs it except /healthz.
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: system
  - name: demo
  - name: me
  - name: workspaces
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Service health
      tags: [system]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /demo/challenge:
    get:
      operationId: getDemoChallenge
      summary: A proof-of-work challenge for one demo run (no account needed)
      tags: [demo]
      security: []
      responses:
        '200':
          description: Find a nonce so that sha256(token + ":" + nonce) starts with `bits` zero bits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoChallenge'
  /demo/runs:
    post:
      operationId: runDemo
      summary: Run a sample helper without an account (Test mode, nothing saved or sent)
      tags: [demo]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoRequest'
      responses:
        '200':
          description: The result card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /me:
    get:
      operationId: getMe
      summary: The signed-in user and their workspaces
      tags: [me]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /workspaces:
    post:
      operationId: createWorkspace
      summary: Create a workspace (you become its owner)
      description: Also creates your owner membership and the included brain. At most 5 workspaces per user.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewWorkspace'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: getWorkspace
      summary: One of your workspaces
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateWorkspace
      summary: Change name, timezone, language or About me facts (owner only)
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspaceId}/feed:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listFeed
      summary: The Feed, newest first, with the Needs me count and the brain allowance
      description: |
        Live updates: `GET /api/workspaces/{workspaceId}/events` streams Server-Sent Events
        (`feed` with a FeedCard id, `run` with a run id, status and helper, `step` with a run id, brick and counts,
        `reload` after a gap). Send the
        bearer token as a header (read the stream with fetch; EventSource can't send headers).
      tags: [feed]
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, needs_me, results]
            default: all
        - name: before
          in: query
          description: Paging; the created_at of the last card you have
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspaceId}/templates:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listTemplates
      summary: The Shelf, sorted by your needs, in your language, with known About me facts filled in
      tags: [shelf]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShelfTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspaceId}/helpers:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listHelpers
      summary: Your helpers, newest first
      tags: [helpers]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [helpers]
                properties:
                  helpers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Helper'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createHelper
      summary: Make a helper from a Shelf template, optionally running a test right away
      description: |
        Answers are keyed by question key (About me facts by their fact key; they're remembered for all helpers).
        For a "place" question, answer a place id, or `feed` to keep results in the Feed only.
      tags: [helpers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewHelper'
      responses:
        '201':
          description: Created (and active)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedHelper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /helpers/{helperId}:
    parameters:
      - $ref: '#/components/parameters/HelperId'
    get:
      operationId: getHelper
      summary: A helper with its bricks in plain words and its recent runs
      tags: [helpers]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelperDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateHelper
      summary: Rename a helper, or switch it on or off
      tags: [helpers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                status:
                  type: string
                  enum: [active, paused]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Helper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteHelper
      summary: Delete a helper with its runs and Feed cards
      tags: [helpers]
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /helpers/{helperId}/runs:
    parameters:
      - $ref: '#/components/parameters/HelperId'
    post:
      operationId: startRun
      summary: Run a helper now (Tap Go, or a test run with at most 3 cards)
      tags: [helpers]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                test:
                  type: boolean
                answer:
                  type: string
                  maxLength: 500
                  description: The answer to Tap Go's question ({answer})
      responses:
        '202':
          description: Started; follow it in the Feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStarted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /feed-cards/{feedCardId}/dismiss:
    parameters:
      - $ref: '#/components/parameters/FeedCardId'
    post:
      operationId: dismissFeedCard
      summary: Hide a Result or Problem card (or a decided or expired one) from the Feed
      tags: [feed]
      responses:
        '200':
          description: Dismissed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedCard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /feed-cards/{feedCardId}:
    parameters:
      - $ref: '#/components/parameters/FeedCardId'
    get:
      operationId: getFeedCard
      summary: A Feed card, with the cards it asks about (Check first, Let me pick)
      tags: [feed]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedCardDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /feed-cards/{feedCardId}/decision:
    parameters:
      - $ref: '#/components/parameters/FeedCardId'
    post:
      operationId: decideFeedCard
      summary: Answer an Ask me card; the waiting run goes on
      description: |
        Check first (`approval`): `approved` (optionally with `skip`), `edited` (with `edits`, optionally `skip`) or `skipped` (everything).
        Let me pick (`pick`): `answered` with `picked`. Ask me something (`question`): `answered` with `answer`.
        Approved cards may then go to the recipients they show; edited fields count as typed by you.
      tags: [feed]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedDecision'
      responses:
        '200':
          description: Decided; the run continues in the background
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedCard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Eurobase end-user access token (ES256)
  parameters:
    HelperId:
      name: helperId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FeedCardId:
      name: feedCardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The request is invalid; error says why
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: You can see this but not change it
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Already decided or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too many requests; try again later
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Not available right now
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found, or not yours
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      required: [status, env, eurobase]
      properties:
        status:
          type: string
          example: ok
        env:
          type: string
          example: dev
        eurobase:
          type: string
          enum: [reachable, unreachable, not configured, error]
    DemoChallenge:
      type: object
      required: [token, bits]
      properties:
        token:
          type: string
        bits:
          type: integer
    DemoRequest:
      type: object
      required: [template, city, token, nonce]
      properties:
        template:
          type: string
          enum: [morning-briefing, weekend-scout]
        lang:
          $ref: '#/components/schemas/Locale'
        business:
          type: string
          maxLength: 60
          description: Morning Briefing only
        city:
          type: string
          maxLength: 60
        timezone:
          type: string
          maxLength: 64
        token:
          type: string
          maxLength: 200
        nonce:
          type: string
          maxLength: 20
    DemoLink:
      type: object
      required: [title, url]
      properties:
        title:
          type: string
        url:
          type: string
    DemoCard:
      type: object
      required: [title, summary, url]
      properties:
        title:
          type: string
        summary:
          type: string
        url:
          type: string
    DemoResult:
      type: object
      required: [template, name, avatar, title, body, links, cards, cached]
      properties:
        template:
          type: string
        name:
          type: string
        avatar:
          type: string
        title:
          type: string
        body:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/DemoLink'
        cards:
          type: array
          items:
            $ref: '#/components/schemas/DemoCard'
        cached:
          type: boolean
        seconds:
          type: number
    Error:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          description: Human-readable message (English)
        code:
          type: string
          description: Stable machine code
          enum: [bad_request, unauthorized, forbidden, not_found, conflict, auth_unavailable, rate_limited, unavailable, internal]
    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
    Role:
      type: string
      enum: [owner, member]
    Plan:
      type: string
      enum: [free, starter, business]
    Locale:
      type: string
      enum: [en, de]
    WorkspaceSummary:
      type: object
      required: [id, name, role, timezone, locale, plan]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        timezone:
          type: string
          example: Europe/Berlin
        locale:
          $ref: '#/components/schemas/Locale'
        plan:
          $ref: '#/components/schemas/Plan'
    Me:
      type: object
      required: [user, workspaces]
      properties:
        user:
          $ref: '#/components/schemas/User'
        workspaces:
          type: array
          description: Oldest first. Empty for a new user (onboarding creates one).
          items:
            $ref: '#/components/schemas/WorkspaceSummary'
    Profile:
      type: object
      description: About me facts by key (see packages/catalog/bricks.json `profile`), used as {my city} etc.
      additionalProperties:
        type: string
        maxLength: 500
      example:
        city: Berlin
        business: bakery
    Workspace:
      allOf:
        - $ref: '#/components/schemas/WorkspaceSummary'
        - type: object
          required: [profile, created_at]
          properties:
            profile:
              $ref: '#/components/schemas/Profile'
            needs:
              $ref: '#/components/schemas/Needs'
            created_at:
              type: string
              format: date-time
    Needs:
      type: array
      description: What you want help with (onboarding); pre-sorts the Shelf
      maxItems: 3
      uniqueItems: true
      items:
        $ref: '#/components/schemas/Need'
    Need:
      type: string
      enum: [find_customers, stay_up_to_date, sort_emails, book_meetings, watch_competitors, plan_events, post_social]
    NewWorkspace:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: Bäckerei Krause
        timezone:
          type: string
          description: IANA name; default Europe/Berlin (the web app sends the browser's)
          example: Europe/Berlin
        locale:
          $ref: '#/components/schemas/Locale'
        profile:
          $ref: '#/components/schemas/Profile'
        needs:
          $ref: '#/components/schemas/Needs'
    WorkspaceUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        timezone:
          type: string
        locale:
          $ref: '#/components/schemas/Locale'
        profile:
          $ref: '#/components/schemas/Profile'
        needs:
          $ref: '#/components/schemas/Needs'
    FeedCard:
      type: object
      required: [id, workspace_id, type, title, payload, state, created_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        helper_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        helper:
          $ref: '#/components/schemas/HelperRef'
        type:
          type: string
          enum: [result, approval, pick, question, problem]
        title:
          type: string
        body:
          type: string
        payload:
          type: object
          additionalProperties: true
          description: 'Ask me cards: brick_id, brick_type, cards (count), and question/answers/free_text, max_show or on_timeout'
        state:
          type: string
          enum: [open, approved, edited, skipped, answered, expired, dismissed]
        decision:
          type: object
          additionalProperties: true
        expires_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    FeedCardDetail:
      allOf:
        - $ref: '#/components/schemas/FeedCard'
        - type: object
          required: [cards]
          properties:
            cards:
              type: array
              description: The pile the card asks about, in order (empty for questions and results)
              items:
                $ref: '#/components/schemas/Card'
    Card:
      type: object
      required: [id, kind, fields, trust]
      properties:
        id:
          type: string
          format: uuid
          description: The card's identity across steps; use it in skip, edits and picked
        kind:
          type: string
          example: business
        fields:
          type: object
          additionalProperties: true
        trust:
          type: object
          description: Per field, where the value came from
          additionalProperties:
            type: string
            enum: [user_entered, approved, extracted, untrusted]
        source_url:
          type: string
        score:
          type: number
        reason:
          type: string
    FeedDecision:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [approved, edited, skipped, answered]
        skip:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
        edits:
          type: object
          description: Card id → field → new text
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        picked:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
        answer:
          type: string
          maxLength: 2000
    HelperRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        avatar:
          type: string
          description: An emoji
    FeedPage:
      type: object
      required: [cards, needs_me, brain]
      properties:
        cards:
          type: array
          items:
            $ref: '#/components/schemas/FeedCard'
        needs_me:
          type: integer
          description: Open cards waiting for you (the badge)
        next_before:
          type: string
          format: date-time
          description: Pass as `before` for the next page; missing on the last page
        brain:
          $ref: '#/components/schemas/BrainMeter'
    BrainMeter:
      type: object
      required: [mode, allowance_credits, credits_left]
      properties:
        mode:
          type: string
          enum: [included, byok]
        allowance_credits:
          type: number
          description: Included credits per month (1 credit ≈ €0.001 of AI)
        credits_left:
          type: number
    ShelfTemplate:
      type: object
      required: [slug, name, promise, category, avatar, bricks, questions, brain, places, paid, match]
      properties:
        slug:
          type: string
          example: morning-briefing
        name:
          type: string
        promise:
          type: string
        category:
          $ref: '#/components/schemas/Need'
        avatar:
          type: string
        bricks:
          type: array
          items:
            $ref: '#/components/schemas/BrickPreview'
        questions:
          type: array
          description: Only what's still open (known About me facts are skipped)
          items:
            $ref: '#/components/schemas/SetupQuestion'
        brain:
          type: boolean
          description: Uses the AI brain
        places:
          type: array
          description: Chat place types any of which works (empty = none needed)
          items:
            type: string
        paid:
          type: boolean
        match:
          type: integer
          description: How well it fits your needs (0 = not one of them)
    BrickPreview:
      type: object
      required: [id, type, group, sentence]
      properties:
        id:
          type: string
        type:
          type: string
        group:
          type: string
          enum: [when, look, think, do, ask]
        sentence:
          type: string
    SetupQuestion:
      type: object
      required: [key, kind, profile, text]
      properties:
        key:
          type: string
        kind:
          type: string
          enum: [text, select, place, list, time]
        profile:
          type: boolean
          description: An About me fact (remembered for all helpers)
        text:
          type: string
        placeholder:
          type: string
        fills:
          type: array
          description: Bricks this answer fills (for a place answered with `feed`, these are left out)
          items:
            type: string
    NewHelper:
      type: object
      required: [template, answers]
      properties:
        template:
          type: string
          description: Template slug
        answers:
          type: object
          additionalProperties:
            type: string
            maxLength: 2000
        run_test:
          type: boolean
          description: Start a test run right away
        just_this_helper:
          type: array
          description: About me facts answered here that stay with this helper instead of the workspace profile
          items:
            type: string
            maxLength: 40
          maxItems: 10
    Helper:
      type: object
      required: [id, name, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        avatar:
          type: string
        status:
          type: string
          enum: [draft, active, paused]
        next_run_at:
          type: string
          format: date-time
          description: When its schedule runs next (only when on and scheduled)
        run:
          $ref: '#/components/schemas/RunProgress'
        created_at:
          type: string
          format: date-time
    RunProgress:
      type: object
      description: The run going on now (queued, running or waiting for you)
      required: [id, status, step, steps, test]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, waiting]
        step:
          type: integer
          description: Index of the brick it's at (0-based)
        steps:
          type: integer
          description: Number of bricks
        test:
          type: boolean
    StepProgress:
      type: object
      required: [brick_id, status, cards_in, cards_out]
      properties:
        brick_id:
          type: string
        status:
          type: string
          enum: [running, waiting, done, failed, skipped]
        cards_in:
          type: integer
        cards_out:
          type: integer
    HelperDetail:
      type: object
      required: [helper, bricks, runs]
      properties:
        helper:
          $ref: '#/components/schemas/Helper'
        bricks:
          type: array
          items:
            $ref: '#/components/schemas/BrickPreview'
        runs:
          type: array
          description: The last 10 runs, newest first
          items:
            $ref: '#/components/schemas/RunSummary'
        steps:
          type: array
          description: The latest run's steps, by brick (for the live run view)
          items:
            $ref: '#/components/schemas/StepProgress'
    RunSummary:
      type: object
      required: [id, status, trigger_type, test, created_at, cost_eur]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, waiting, done, failed, stopped]
        trigger_type:
          type: string
        test:
          type: boolean
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        cost_eur:
          type: number
        cards_out:
          type: integer
          description: Cards the run ended with (its last finished brick), once it is done
    CreatedHelper:
      type: object
      required: [helper]
      properties:
        helper:
          $ref: '#/components/schemas/Helper'
        run_id:
          type: string
          format: uuid
    RunStarted:
      type: object
      required: [run_id]
      properties:
        run_id:
          type: string
          format: uuid
