version: '3'

dotenv: ['.env']

vars:
  BACKEND: backend
  WEB: apps/web

tasks:
  default:
    cmds:
      - task --list
    silent: true

  setup:
    desc: Install dependencies
    cmds:
      - pnpm install
      - cd {{.BACKEND}} && go mod download

  dev:
    desc: Run api, worker and web together (web on :5173, api on :8787)
    deps: [dev:api, dev:worker, dev:web]

  dev:api:
    desc: Run the Go api
    dir: '{{.BACKEND}}'
    cmds:
      - go run ./cmd/api

  dev:worker:
    desc: Run the Go worker against the laamo Eurobase project (needs EUROBASE_PRIVATE_KEY)
    dir: '{{.BACKEND}}'
    cmds:
      - go run ./cmd/worker

  dev:web:
    desc: Run the SvelteKit dev server
    cmds:
      - pnpm --filter @laamo/web dev

  up:
    desc: Start local helpers (Mailpit, Overpass mock)
    cmds:
      - docker compose up -d

  down:
    desc: Stop local helpers
    cmds:
      - docker compose down

  gen:
    desc: Generate Go server stubs and TS client from OpenAPI
    cmds:
      - echo "Not wired yet, see issue #11"

  test:
    desc: Run all tests
    cmds:
      - cd {{.BACKEND}} && go test ./...
      - pnpm -r test
      - scripts/test-migrations.sh

  lint:
    desc: Lint and type-check everything
    cmds:
      - cd {{.BACKEND}} && gofmt -l . | (! grep .) && go vet ./...
      # CI always runs golangci-lint; locally it's skipped if not installed.
      - |
        if command -v golangci-lint >/dev/null; then
          cd {{.BACKEND}} && golangci-lint run ./...
        else
          echo "golangci-lint not installed, skipping"
        fi
      - pnpm -r lint
      - pnpm -r check
      - scripts/check-web-secrets.sh

  build:
    desc: Build all binaries and the web app
    cmds:
      - cd {{.BACKEND}} && mkdir -p bin && go build -o bin/ ./cmd/...
      - pnpm -r build

  test:live:
    desc: Live checks against the laamo Eurobase project (store reads only; queue round trip with one ping job it deletes)
    dir: backend
    env:
      LAAMO_EUROBASE_LIVE: "1"
    cmds:
      - go test -count=1 -run TestLive -v ./internal/store/eurobase/ ./internal/queue/eurobase/

  migrate:
    desc: Apply pending migrations and sync cron jobs (migrations/cron.json) on the laamo Eurobase project
    cmds:
      - eurobase switch laamo
      - eurobase migrations up
      - scripts/sync-cron.sh

  migrate:status:
    desc: Show local migrations vs applied versions on Eurobase
    cmds:
      - eurobase switch laamo
      - eurobase migrations status

  test:migrations:
    desc: Apply migrations to a throwaway Postgres and run the RLS tests (Docker)
    cmds:
      - scripts/test-migrations.sh
