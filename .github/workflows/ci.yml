name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: Go (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: backend
      - run: go test -race ./...
      - run: go build ./cmd/...

  web:
    name: Web (lint + check + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @laamo/web lint
      - run: pnpm --filter @laamo/web check
      - run: pnpm --filter @laamo/web test
      - run: pnpm --filter @laamo/web build
      - name: No server-only secrets in the web app
        run: scripts/check-web-secrets.sh
        env:
          # Optional repo secret. When set, the built bundle is scanned for its value.
          EUROBASE_PRIVATE_KEY: ${{ secrets.EUROBASE_PRIVATE_KEY }}

  migrations:
    name: Migrations (apply + RLS tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/test-migrations.sh

  images:
    name: Image (${{ matrix.service }})
    needs: [go, web, migrations]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: api, dockerfile: deploy/docker/go.Dockerfile }
          - { service: worker, dockerfile: deploy/docker/go.Dockerfile }
          - { service: mailin, dockerfile: deploy/docker/go.Dockerfile }
          - { service: web, dockerfile: deploy/docker/web.Dockerfile }
    env:
      # Scaleway Container Registry, Paris. Set repo variable SCW_REGISTRY_NAMESPACE
      # and secret SCW_SECRET_KEY to enable pushing on main.
      REGISTRY: rg.fr-par.scw.cloud
      NAMESPACE: ${{ vars.SCW_REGISTRY_NAMESPACE }}
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SCW_REGISTRY_NAMESPACE != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE || 'laamo' }}/${{ matrix.service }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: CMD=${{ matrix.service }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
