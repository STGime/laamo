server {
    listen 8080;
    root /usr/share/nginx/html;

    # Hashed build assets can be cached forever.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Site pages are prerendered (/ → index.html, /de → de.html); every
    # other path is the app (app.html, rendered in the browser).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html /app.html;
    }

    # The app is not for search engines.
    location = /app.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex";
    }
}
